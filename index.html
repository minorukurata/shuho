<style>
:root{--washi:#F5F0E8;--ink:#1A1410;--sumi:#1C1508;--gold:#C9991A;--aka:#7A1515;--mizu:#3D6B7A;--rule:#C8BFA8;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--washi);color:var(--ink);font-family:'Noto Serif JP',serif;overflow-x:hidden;}
.hdr{position:sticky;top:0;z-index:200;background:var(--sumi);display:flex;align-items:center;justify-content:space-between;padding:16px 20px 13px;border-bottom:2px solid var(--gold);box-shadow:0 2px 16px rgba(0,0,0,.5);}
.hdr-jp{font-family:'Cinzel',serif;font-size:20px;letter-spacing:6px;color:var(--gold);}
.hdr-es{font-size:10px;letter-spacing:2px;color:#A89870;margin-top:2px;font-style:italic;}
.hdr-date{font-size:11px;color:#8A7A60;font-family:'Noto Sans JP';text-align:right;line-height:1.7;}
.tabs{display:flex;background:#1A150A;border-bottom:1px solid #3A3020;}
.tab{flex:1;padding:11px 6px;font-size:11px;letter-spacing:1px;border:none;background:transparent;cursor:pointer;color:#7A6A50;font-family:'Noto Sans JP';border-bottom:2px solid transparent;transition:all .25s;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover:not(.active){background:rgba(255,255,255,.04);}
.parallax-block{position:relative;overflow:hidden;height:160px;}
.parallax-img{position:absolute;inset:-30% 0;width:100%;height:160%;object-fit:cover;will-change:transform;}
.parallax-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.55));}
.p-kanji{font-family:'Cinzel',serif;font-size:26px;letter-spacing:8px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);}
.p-romaji{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.65);font-family:'Noto Sans JP';}
.time-badge{margin-top:6px;background:rgba(201,153,26,.88);color:#1A1410;font-size:10px;padding:2px 10px;border-radius:20px;letter-spacing:2px;font-family:'Noto Sans JP';font-weight:500;}
.s-card{margin:0 12px;background:#fff;border:1px solid var(--rule);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.zoom-row{display:grid;grid-template-columns:96px 1fr;padding:10px 14px;border-bottom:1px solid #F0EBE0;align-items:start;gap:8px;will-change:transform,opacity;transform-origin:left center;}
.zoom-row:last-child{border-bottom:none;}
.r-lbl{font-size:10px;color:#AAA090;font-family:'Noto Sans JP';line-height:1.6;padding-top:3px;transition:color .3s;}
.zoom-row.active .r-lbl{color:#6A5A48;}
.r-val{display:flex;flex-direction:column;gap:3px;}
.r-jp{font-size:13px;line-height:1.55;color:#9A8870;transition:color .3s;will-change:font-size;}
.zoom-row.active .r-jp{color:var(--ink);}
.r-es{font-size:11px;color:#B0C4CC;font-style:italic;line-height:1.5;transition:color .3s;}
.zoom-row.active .r-es{color:var(--mizu);}
.h-tag{display:inline-block;padding:1px 5px;border-radius:2px;font-size:9px;margin-right:3px;font-family:'Noto Sans JP';}
.h-jp{background:var(--aka);color:#fff;}
.h-es{background:var(--mizu);color:#fff;}
.feliz{text-align:center;padding:14px 16px 10px;font-size:13px;color:var(--aka);font-weight:600;letter-spacing:2px;font-family:'Cinzel',serif;border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#FDF6E8 0%,var(--washi) 100%);}
.prayer{margin:20px 12px 0;background:linear-gradient(135deg,#1C1508 0%,#2E2210 100%);color:var(--washi);padding:16px;border-left:3px solid var(--gold);}
.prayer-ttl{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:10px;font-family:'Noto Sans JP';}
.p-zoom{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-family:'Noto Sans JP';will-change:font-size,opacity;transform-origin:left center;}
.p-zoom:last-child{border-bottom:none;}
.p-date{color:var(--gold);font-size:10px;min-width:34px;padding-top:2px;}
.p-text{font-size:11px;color:rgba(255,255,255,.6);transition:color .3s;}
.anuncio{margin:14px 12px 0;background:#FFF8EE;border:1px solid #E8D5A8;padding:14px;}
.anuncio-ttl{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;font-family:'Noto Sans JP';}
.a-zoom{font-size:11px;padding:5px 0;border-bottom:1px dashed #DDD0A8;font-family:'Noto Sans JP';color:#B0A080;will-change:font-size,opacity;transform-origin:left center;transition:color .3s;}
.a-zoom:last-child{border-bottom:none;}
.footer{text-align:center;padding:28px 14px 40px;color:#9A8A78;font-size:10px;font-family:'Noto Sans JP';letter-spacing:1px;line-height:2;}
.share-bar{margin:16px 12px 20px;}
.share-btn{background:#128C7E;color:#fff;border:none;border-radius:3px;padding:13px;font-size:13px;width:100%;cursor:pointer;font-family:'Noto Sans JP';letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;}
.share-btn:hover{background:#0A6B5E;}
.reveal{opacity:0;transform:translateY(20px);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sumi);color:var(--washi);padding:10px 20px;border-radius:20px;font-size:11px;font-family:'Noto Sans JP';border:1px solid var(--gold);z-index:999;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.ed-wrap{margin:12px;}
.ed-group{background:#fff;border:1px solid var(--rule);padding:14px;margin-bottom:12px;}
.ed-grp-ttl{display:block;font-size:9px;letter-spacing:3px;background:var(--sumi);color:var(--gold);padding:6px 10px;margin-bottom:10px;}
.ed-lbl{display:block;font-size:10px;color:#7A6A56;letter-spacing:1px;margin-bottom:4px;font-family:'Noto Sans JP';}
.ed-in{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;font-family:'Noto Sans JP';font-size:12px;background:#FDFAF5;color:var(--ink);margin-bottom:10px;outline:none;transition:border-color .2s;}
.ed-in:focus{border-color:var(--mizu);}
.ed-bi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.btn-ok{background:var(--aka);color:#fff;border:none;padding:12px;width:100%;font-family:'Noto Sans JP';font-size:13px;letter-spacing:2px;cursor:pointer;transition:background .2s;}
.btn-ok:hover{background:#5A1010;}
.btn-reset{background:transparent;color:#8A7A60;border:1px solid #C8BFA8;padding:10px;width:100%;font-family:'Noto Sans JP';font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.btn-reset:hover{background:#F0E8D8;color:var(--aka);border-color:var(--aka);}

/* ── TOOLTIP INFO ── */
.info-wrap{position:relative;display:inline-flex;align-items:center;margin-left:5px;vertical-align:middle;}
.info-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;border:1px solid var(--mizu);
  background:rgba(61,107,122,0.15);color:var(--mizu);font-size:9px;
  cursor:pointer;font-weight:700;font-family:'Noto Sans JP';
  line-height:1;flex-shrink:0;
}
.info-tooltip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#0E1A20;border:1px solid var(--mizu);border-radius:3px;
  padding:8px 10px;min-width:180px;max-width:240px;
  font-size:10px;color:#C8DDE4;font-family:'Noto Sans JP';line-height:1.6;
  box-shadow:0 4px 16px rgba(0,0,0,.6);z-index:400;
  white-space:pre-line;
}
.info-tooltip::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--mizu);
}
.field-label-row{display:flex;align-items:center;margin-bottom:4px;}

/* ── HIMNO INPUT ── */
.himno-wrap{position:relative;width:100%;}
.himno-in{
  width:100%;padding:8px 10px;border:1px solid var(--gold);border-radius:2px;
  font-family:'Noto Sans JP';font-size:12px;background:#1C1508;color:var(--gold);
  margin-bottom:0;outline:none;transition:border-color .2s;
  letter-spacing:1px;
}
.himno-in:focus{border-color:#F0C030;box-shadow:0 0 0 2px rgba(201,153,26,.2);}
.himno-in::placeholder{color:#5A4A28;}
.himno-preview{
  font-size:10px;color:#A89060;font-family:'Noto Sans JP';
  padding:3px 10px 5px;font-style:italic;
  border:1px solid rgba(201,153,26,.2);border-top:none;background:#120E04;
}

/* ── AUTOCOMPLETE ── */
.ac-wrap{position:relative;width:100%;}
.ac-list{
  position:absolute;top:100%;left:0;right:0;z-index:300;
  background:#1C1508;border:1px solid var(--gold);
  border-top:none;border-radius:0 0 3px 3px;
  max-height:160px;overflow-y:auto;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.ac-item{
  padding:9px 12px;font-size:12px;font-family:'Noto Sans JP';
  color:#D4C9A8;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);
  transition:background .15s;
}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.sel{background:rgba(201,153,26,.18);color:var(--gold);}
.ac-match{color:var(--gold);font-weight:600;}

/* ── POPUP ── */
.popup-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(10,8,4,0.82);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:overlayIn .5s ease;
}
.popup-overlay.out{animation:overlayOut .6s ease forwards;}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}

.popup-card{
  background:linear-gradient(160deg,#2A1F0A 0%,#1C1508 60%,#0E0B04 100%);
  border:1px solid var(--gold);
  border-radius:4px;
  padding:24px 20px 20px;
  width:100%;max-width:360px;
  position:relative;
  box-shadow:0 0 40px rgba(201,153,26,0.25), 0 0 80px rgba(0,0,0,0.8);
  animation:cardIn .6s cubic-bezier(.16,1,.3,1);
}
.popup-card.out{animation:cardOut .5s ease forwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cardOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.94);}}

.popup-glow{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:60%;height:2px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
}
.popup-icon{text-align:center;font-size:28px;margin-bottom:8px;}
.popup-ttl-jp{font-family:'Cinzel',serif;font-size:18px;letter-spacing:4px;color:var(--gold);text-align:center;margin-bottom:2px;}
.popup-ttl-es{font-size:9px;letter-spacing:3px;color:#8A7A50;text-align:center;margin-bottom:16px;font-family:'Noto Sans JP';}
.popup-divider{border:none;border-top:1px solid rgba(201,153,26,0.25);margin:12px 0;}
.popup-item{
  display:flex;gap:10px;align-items:flex-start;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.popup-item:last-child{border-bottom:none;}
.popup-dot{color:var(--gold);font-size:14px;min-width:16px;margin-top:1px;}
.popup-text{font-size:12px;color:#D4C9A8;font-family:'Noto Sans JP';line-height:1.6;}
.popup-empty{font-size:11px;color:#5A5040;font-family:'Noto Sans JP';text-align:center;padding:10px 0;font-style:italic;}
.popup-close{
  margin-top:18px;width:100%;background:rgba(201,153,26,0.12);
  border:1px solid rgba(201,153,26,0.35);color:var(--gold);
  padding:10px;font-family:'Noto Sans JP';font-size:11px;letter-spacing:2px;
  cursor:pointer;border-radius:2px;transition:all .2s;
}
.popup-close:hover{background:rgba(201,153,26,0.22);}
.popup-timer{
  height:2px;background:rgba(201,153,26,0.2);margin-top:14px;border-radius:1px;overflow:hidden;
}
.popup-timer-bar{
  height:100%;background:var(--gold);
  animation:timerDown 6s linear forwards;
  transform-origin:left;
}
@keyframes timerDown{from{width:100%;}to{width:0%;}}

/* ── PEDIDOS DE ORACIÓN sección ── */
.pedidos{margin:14px 12px 0;background:linear-gradient(135deg,#0E1A1F 0%,#162028 100%);border-left:3px solid var(--mizu);padding:16px;}

.pedido-item:last-child{border-bottom:none;}
.pedido-num{color:var(--mizu);font-size:10px;min-width:18px;padding-top:2px;}
.pedido-text{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5;}
</style>

/* ── GSAP loader ── */
function useGSAP(cb, deps = []) {
  useEffect(() => {
    let cleanup;
    const load = async () => {
      if (!window.gsap) {
        await new Promise(res => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js";
          s.onload = res;
          document.head.appendChild(s);
        });
      }
      if (!window.ScrollTrigger) {
        await new Promise(res => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js";
          s.onload = res;
          document.head.appendChild(s);
        });
        window.gsap.registerPlugin(window.ScrollTrigger);
      }
      cleanup = cb(window.gsap, window.ScrollTrigger);
    };
    load();
    return () => {
      if (typeof cleanup === "function") cleanup();
    };
  }, deps);
}

function loadNames() {
  try {
    const saved = JSON.parse(localStorage.getItem(NAMES_KEY)) || [];
    return [...new Set([...PRESET_NAMES, ...saved])];
  } catch (e) {
    return PRESET_NAMES; // [];
  }
}
function saveNames(names) {
  try {
    localStorage.setItem(NAMES_KEY, JSON.stringify([...new Set(names)].slice(0, 200)));
  } catch (e) {}
}
function extractNames(data) {
  const fields = ["_jp", "_es"];
  const sections = [data.culto, data.escuela, data.anuncios];
  const names = [];
  sections.forEach(sec => {
    if (!sec) return;
    Object.entries(sec).forEach(([k, v]) => {
      if (typeof v === "string" && v.trim().length > 1) {
        // Split by / and spaces to get individual names
        v.split("/").forEach(n => {
          const t = n.trim();
          if (t.length > 1) names.push(t);
        });
      }
    });
  });
  return names;
}
function loadData() {
  // 1. Lee la URL primero (link compartido)
  try {
    const hash = window.location.hash.slice(1);
    if (hash.startsWith("d=")) {
      const decoded = JSON.parse(decodeURIComponent(atob(hash.slice(2))));
      return {
        ...initialData,
        ...decoded
      };
    }
  } catch (e) {}
  // 2. localStorage (edicion propia)
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return {
      ...initialData,
      ...JSON.parse(saved)
    };
  } catch (e) {}
  return initialData;
}

function ZoomRow({
  label,
  jp,
  es,
  hymn
}) {
  const rowRef = useRef(null);
  const jpRef = useRef(null);
  useGSAP((gsap, ST) => {
    const row = rowRef.current;
    const jpEl = jpRef.current;
    if (!row || !jpEl) return;
    gsap.fromTo(jpEl, {
      fontSize: "12px",
      opacity: 0.45
    }, {
      fontSize: "20px",
      opacity: 1,
      ease: "power1.inOut",
      scrollTrigger: {
        trigger: row,
        start: "top 82%",
        end: "top 50%",
        scrub: 0.6
      }
    });
    gsap.fromTo(jpEl, {
      fontSize: "20px",
      opacity: 1
    }, {

/* ── Helpers de fecha ── */
function nextSaturday() {
  const today = new Date();
  const day = today.getDay(); // 0=Sun..6=Sat
  const diff = day === 6 ? 7 : 6 - day; // si hoy es sábado, el próximo es en 7 días
  const sat = new Date(today);
  sat.setDate(today.getDate() + diff);
  return sat;
}
function formatFechaEs(d) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yy = d.getFullYear();
  return `${dd}/${mm}/${yy}`;
}
function formatFechaJp(d) {
  // 令和元年 = 2019
  const reiwaStart = 2019;
  const year = d.getFullYear();
  const reiwaYear = year - reiwaStart + 1;
  const months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
  const month = months[d.getMonth()];
  const day = d.getDate();
  const reiwaStr = reiwaYear === 1 ? "令和元年" : `令和${reiwaYear}年`;
  return `${reiwaStr}${month}${day}日（土）`;
}
function buildNewWeekData(base) {
  const sat = nextSaturday();
  const fechaEs = formatFechaEs(sat);
  const fechaJp = formatFechaJp(sat);
  // Update oración diaria dates
  const oraciones = base.oraciones.map((o, i) => {
    const d = new Date(sat);
    d.setDate(sat.getDate() + i);
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return {
      ...o,
      fecha: `${dd}/${mm}`
    };
  });
  return {
    ...base,
    fecha: fechaEs,
    fechaJp,
    oraciones
  };
}
