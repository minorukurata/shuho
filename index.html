<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1C1508"/>
<title>週報 — Iglesia Adventista Japonesa Paraguay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--washi:#F5F0E8;--ink:#1A1410;--sumi:#1C1508;--gold:#C9991A;--aka:#7A1515;--mizu:#3D6B7A;--rule:#C8BFA8;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--washi);color:var(--ink);font-family:'Noto Serif JP',serif;overflow-x:hidden;}
.hdr{position:sticky;top:0;z-index:200;background:var(--sumi);display:flex;align-items:center;justify-content:space-between;padding:16px 20px 13px;border-bottom:2px solid var(--gold);box-shadow:0 2px 16px rgba(0,0,0,.5);}
.hdr-jp{font-family:'Cinzel',serif;font-size:20px;letter-spacing:6px;color:var(--gold);}
.hdr-es{font-size:10px;letter-spacing:2px;color:#A89870;margin-top:2px;font-style:italic;}
.hdr-date{font-size:11px;color:#8A7A60;font-family:'Noto Sans JP';text-align:right;line-height:1.7;}
.tabs{display:flex;background:#1A150A;border-bottom:1px solid #3A3020;}
.tab{flex:1;padding:11px 6px;font-size:11px;letter-spacing:1px;border:none;background:transparent;cursor:pointer;color:#7A6A50;font-family:'Noto Sans JP';border-bottom:2px solid transparent;transition:all .25s;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover:not(.active){background:rgba(255,255,255,.04);}
.parallax-block{position:relative;overflow:hidden;height:160px;}
.parallax-img{position:absolute;inset:-30% 0;width:100%;height:160%;object-fit:cover;will-change:transform;}
.parallax-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.55));}
.p-kanji{font-family:'Cinzel',serif;font-size:26px;letter-spacing:8px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);}
.p-romaji{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.65);font-family:'Noto Sans JP';}
.time-badge{margin-top:6px;background:rgba(201,153,26,.88);color:#1A1410;font-size:10px;padding:2px 10px;border-radius:20px;letter-spacing:2px;font-family:'Noto Sans JP';font-weight:500;}
.s-card{margin:0 12px;background:#fff;border:1px solid var(--rule);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.zoom-row{display:grid;grid-template-columns:96px 1fr;padding:10px 14px;border-bottom:1px solid #F0EBE0;align-items:start;gap:8px;will-change:transform,opacity;transform-origin:left center;}
.zoom-row:last-child{border-bottom:none;}
.r-lbl{font-size:10px;color:#AAA090;font-family:'Noto Sans JP';line-height:1.6;padding-top:3px;transition:color .3s;}
.zoom-row.active .r-lbl{color:#6A5A48;}
.r-val{display:flex;flex-direction:column;gap:3px;}
.r-jp{font-size:13px;line-height:1.55;color:#9A8870;transition:color .3s;will-change:font-size;}
.zoom-row.active .r-jp{color:var(--ink);}
.r-es{font-size:11px;color:#B0C4CC;font-style:italic;line-height:1.5;transition:color .3s;}
.zoom-row.active .r-es{color:var(--mizu);}
.h-tag{display:inline-block;padding:1px 5px;border-radius:2px;font-size:9px;margin-right:3px;font-family:'Noto Sans JP';}
.h-jp{background:var(--aka);color:#fff;}
.h-es{background:var(--mizu);color:#fff;}
.feliz{text-align:center;padding:14px 16px 10px;font-size:13px;color:var(--aka);font-weight:600;letter-spacing:2px;font-family:'Cinzel',serif;border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#FDF6E8 0%,var(--washi) 100%);}
.prayer{margin:20px 12px 0;background:linear-gradient(135deg,#1C1508 0%,#2E2210 100%);color:var(--washi);padding:16px;border-left:3px solid var(--gold);}
.prayer-ttl{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:10px;font-family:'Noto Sans JP';}
.p-zoom{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-family:'Noto Sans JP';will-change:font-size,opacity;transform-origin:left center;}
.p-zoom:last-child{border-bottom:none;}
.p-date{color:var(--gold);font-size:10px;min-width:34px;padding-top:2px;}
.p-text{font-size:11px;color:rgba(255,255,255,.6);transition:color .3s;}
.anuncio{margin:14px 12px 0;background:#FFF8EE;border:1px solid #E8D5A8;padding:14px;}
.anuncio-ttl{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;font-family:'Noto Sans JP';}
.a-zoom{font-size:11px;padding:5px 0;border-bottom:1px dashed #DDD0A8;font-family:'Noto Sans JP';color:#B0A080;will-change:font-size,opacity;transform-origin:left center;transition:color .3s;}
.a-zoom:last-child{border-bottom:none;}
.footer{text-align:center;padding:28px 14px 40px;color:#9A8A78;font-size:10px;font-family:'Noto Sans JP';letter-spacing:1px;line-height:2;}
.share-bar{margin:16px 12px 20px;}
.share-btn{background:#128C7E;color:#fff;border:none;border-radius:3px;padding:13px;font-size:13px;width:100%;cursor:pointer;font-family:'Noto Sans JP';letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;}
.share-btn:hover{background:#0A6B5E;}
.reveal{opacity:0;transform:translateY(20px);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sumi);color:var(--washi);padding:10px 20px;border-radius:20px;font-size:11px;font-family:'Noto Sans JP';border:1px solid var(--gold);z-index:999;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.ed-wrap{margin:12px;}
.ed-group{background:#fff;border:1px solid var(--rule);padding:14px;margin-bottom:12px;}
.ed-grp-ttl{display:block;font-size:9px;letter-spacing:3px;background:var(--sumi);color:var(--gold);padding:6px 10px;margin-bottom:10px;}
.ed-lbl{display:block;font-size:10px;color:#7A6A56;letter-spacing:1px;margin-bottom:4px;font-family:'Noto Sans JP';}
.ed-in{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;font-family:'Noto Sans JP';font-size:12px;background:#FDFAF5;color:var(--ink);margin-bottom:10px;outline:none;transition:border-color .2s;}
.ed-in:focus{border-color:var(--mizu);}
.ed-bi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.btn-ok{background:var(--aka);color:#fff;border:none;padding:12px;width:100%;font-family:'Noto Sans JP';font-size:13px;letter-spacing:2px;cursor:pointer;transition:background .2s;}
.btn-ok:hover{background:#5A1010;}
.btn-reset{background:transparent;color:#8A7A60;border:1px solid #C8BFA8;padding:10px;width:100%;font-family:'Noto Sans JP';font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.btn-reset:hover{background:#F0E8D8;color:var(--aka);border-color:var(--aka);}

/* ── POPUP ── */
.popup-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(10,8,4,0.82);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:overlayIn .5s ease;
}
.popup-overlay.out{animation:overlayOut .6s ease forwards;}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}

.popup-card{
  background:linear-gradient(160deg,#2A1F0A 0%,#1C1508 60%,#0E0B04 100%);
  border:1px solid var(--gold);
  border-radius:4px;
  padding:24px 20px 20px;
  width:100%;max-width:360px;
  position:relative;
  box-shadow:0 0 40px rgba(201,153,26,0.25), 0 0 80px rgba(0,0,0,0.8);
  animation:cardIn .6s cubic-bezier(.16,1,.3,1);
}
.popup-card.out{animation:cardOut .5s ease forwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cardOut{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(.94);}}

.popup-glow{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:60%;height:2px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
}
.popup-icon{text-align:center;font-size:28px;margin-bottom:8px;}
.popup-ttl-jp{font-family:'Cinzel',serif;font-size:18px;letter-spacing:4px;color:var(--gold);text-align:center;margin-bottom:2px;}
.popup-ttl-es{font-size:9px;letter-spacing:3px;color:#8A7A50;text-align:center;margin-bottom:16px;font-family:'Noto Sans JP';}
.popup-divider{border:none;border-top:1px solid rgba(201,153,26,0.25);margin:12px 0;}
.popup-item{
  display:flex;gap:10px;align-items:flex-start;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.popup-item:last-child{border-bottom:none;}
.popup-dot{color:var(--gold);font-size:14px;min-width:16px;margin-top:1px;}
.popup-text{font-size:12px;color:#D4C9A8;font-family:'Noto Sans JP';line-height:1.6;}
.popup-empty{font-size:11px;color:#5A5040;font-family:'Noto Sans JP';text-align:center;padding:10px 0;font-style:italic;}
.popup-close{
  margin-top:18px;width:100%;background:rgba(201,153,26,0.12);
  border:1px solid rgba(201,153,26,0.35);color:var(--gold);
  padding:10px;font-family:'Noto Sans JP';font-size:11px;letter-spacing:2px;
  cursor:pointer;border-radius:2px;transition:all .2s;
}
.popup-close:hover{background:rgba(201,153,26,0.22);}
.popup-timer{
  height:2px;background:rgba(201,153,26,0.2);margin-top:14px;border-radius:1px;overflow:hidden;
}
.popup-timer-bar{
  height:100%;background:var(--gold);
  animation:timerDown 6s linear forwards;
  transform-origin:left;
}
@keyframes timerDown{from{width:100%;}to{width:0%;}}

/* ── PEDIDOS DE ORACIÓN sección ── */
.pedidos{margin:14px 12px 0;background:linear-gradient(135deg,#0E1A1F 0%,#162028 100%);border-left:3px solid var(--mizu);padding:16px;}
.pedidos-ttl{font-size:9px;letter-spacing:3px;color:var(--mizu);margin-bottom:10px;font-family:'Noto Sans JP';}
.pedido-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'Noto Sans JP';}
.pedido-item:last-child{border-bottom:none;}
.pedido-num{color:var(--mizu);font-size:10px;min-width:18px;padding-top:2px;}
.pedido-text{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── GSAP loader ── */
function useGSAP(cb, deps = []) {
  useEffect(() => {
    let cleanup;
    const load = async () => {
      if (!window.gsap) {
        await new Promise(res => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js";
          s.onload = res; document.head.appendChild(s);
        });
      }
      if (!window.ScrollTrigger) {
        await new Promise(res => {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js";
          s.onload = res; document.head.appendChild(s);
        });
        window.gsap.registerPlugin(window.ScrollTrigger);
      }
      cleanup = cb(window.gsap, window.ScrollTrigger);
    };
    load();
    return () => { if (typeof cleanup === "function") cleanup(); };
  }, deps);
}

/* ── Datos iniciales ── */
const initialData = {
  fecha:"06/06/2026",
  feliz:"¡¡¡FELIZ SÁBADO!!!　幸せな安息日を！",
  culto:{

    himno1_jp:"1 あめつちこぞりて",himno1_es:"20 A Dios, el padre celestial",

  ]
};

const HERO_ESCUELA = "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80";
const HERO_CULTO   = "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80";
const STORAGE_KEY  = "shuho_data_v1";

function loadData() {
  // 1. Lee la URL primero (link compartido)
  try {
    const hash = window.location.hash.slice(1);
    if (hash.startsWith("d=")) {
      const decoded = JSON.parse(decodeURIComponent(atob(hash.slice(2))));
      return { ...initialData, ...decoded };
    }
  } catch {}
  // 2. localStorage (edicion propia)
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return { ...initialData, ...JSON.parse(saved) };
  } catch {}
  return initialData;
}

/* ── ZoomRow ── */
function ZoomRow({ label, jp, es, hymn }) {
  const rowRef = useRef(null);
  const jpRef  = useRef(null);

  useGSAP((gsap, ST) => {
    const row = rowRef.current;
    const jpEl = jpRef.current;
    if (!row || !jpEl) return;

    gsap.fromTo(jpEl,
      { fontSize:"12px", opacity:0.45 },
      { fontSize:"20px", opacity:1, ease:"power1.inOut",
        scrollTrigger:{ trigger:row, start:"top 82%", end:"top 50%", scrub:0.6 }}
    );
    gsap.fromTo(jpEl,
      { fontSize:"20px", opacity:1 },
      { fontSize:"12px", opacity:0.45, ease:"power1.inOut",
        scrollTrigger:{ trigger:row, start:"top 50%", end:"top 18%", scrub:0.6 }}
    );
    gsap.fromTo(row,
      { backgroundColor:"rgba(201,153,26,0)" },
      { backgroundColor:"rgba(201,153,26,0.07)", ease:"power1.inOut",
        scrollTrigger:{
          trigger:row, start:"top 65%", end:"top 35%", scrub:0.5,
          onEnter:()=>row.classList.add("active"),
          onLeave:()=>row.classList.remove("active"),
          onEnterBack:()=>row.classList.add("active"),
          onLeaveBack:()=>row.classList.remove("active"),
        }}
    );
    return () => ST.getAll().forEach(t => t.kill());
  }, [label]);

  if (!jp && !es) return null;
  return (
    <div className="zoom-row" ref={rowRef}>
      <span className="r-lbl">{label}</span>
      <div className="r-val">
        {hymn ? (
          <>
            <div className="r-jp" ref={jpRef}><span className="h-tag h-jp">♪ JP</span>{jp}</div>
            <div className="r-es"><span className="h-tag h-es">♪ 🇵🇾</span>{es}</div>
          </>
        ) : (
          <>
            <div className="r-jp" ref={jpRef}>{jp}</div>
            {es && es !== jp && <div className="r-es">{es}</div>}
          </>
        )}
      </div>
    </div>
  );
}

/* ── ZoomLine ── */
function ZoomLine({ children, className="p-zoom", textClass="p-text" }) {
  const ref = useRef(null);
  useGSAP((gsap, ST) => {
    const el = ref.current;
    if (!el) return;
    const txt = el.querySelector("." + textClass);
    if (!txt) return;
    gsap.fromTo(txt,
      { fontSize:"11px", opacity:0.4 },
      { fontSize:"16px", opacity:1, ease:"power1.inOut",
        scrollTrigger:{ trigger:el, start:"top 80%", end:"top 50%", scrub:0.6 }}
    );
    gsap.fromTo(txt,
      { fontSize:"16px", opacity:1 },
      { fontSize:"11px", opacity:0.4, ease:"power1.inOut",
        scrollTrigger:{ trigger:el, start:"top 50%", end:"top 20%", scrub:0.6 }}
    );
    gsap.fromTo(el,
      { backgroundColor:"rgba(0,0,0,0)" },
      { backgroundColor: className==="a-zoom" ? "rgba(201,153,26,0.08)" : "rgba(255,255,255,0.04)",
        ease:"power1.inOut",
        scrollTrigger:{
          trigger:el, start:"top 65%", end:"top 35%", scrub:0.5,
          onEnter:()=>el.classList.add("active"),
          onLeave:()=>el.classList.remove("active"),
          onEnterBack:()=>el.classList.add("active"),
          onLeaveBack:()=>el.classList.remove("active"),
        }}
    );
    return () => ST.getAll().forEach(t => t.kill());
  }, []);
  return <div ref={ref} className={className}>{children}</div>;
}

/* ── ParallaxHero ── */
function ParallaxHero({ imgSrc, kanji, romaji, time, id }) {
  const imgRef = useRef(null);
  useGSAP((gsap, ST) => {
    const el = imgRef.current;
    if (!el) return;
    gsap.timeline({
      scrollTrigger:{ trigger:el.parentElement, start:"top bottom", end:"bottom top", scrub:1.2 }
    }).fromTo(el, { yPercent:-12 }, { yPercent:12, ease:"none" });
    gsap.fromTo(el.parentElement,
      { clipPath:"inset(18% 8% round 4px)" },
      { clipPath:"inset(0% 0% round 0px)", ease:"power2.out", duration:1,
        scrollTrigger:{ trigger:el.parentElement, start:"top 88%", toggleActions:"play none none reverse" }}
    );
    return () => ST.getAll().forEach(t => t.kill());
  }, [id]);
  return (
    <div className="parallax-block" id={id}>
      <img ref={imgRef} className="parallax-img" src={imgSrc} alt={romaji} loading="lazy"/>
      <div className="parallax-overlay">
        <span className="p-kanji">{kanji}</span>
        <span className="p-romaji">{romaji}</span>
        {time && <span className="time-badge">{time}</span>}
      </div>
    </div>
  );
}

/* ── Reveal ── */
function Reveal({ children, delay=0 }) {
  const ref = useRef(null);
  useGSAP((gsap, ST) => {
    gsap.to(ref.current, {
      opacity:1, y:0, duration:.7, delay, ease:"power2.out",
      scrollTrigger:{ trigger:ref.current, start:"top 92%", toggleActions:"play none none reverse" }
    });
    return () => ST.getAll().forEach(t => t.kill());
  }, []);
  return <div ref={ref} className="reveal">{children}</div>;
}

/* ── Popup de Anuncios Importantes ── */
function Popup({ data, onClose }) {
  const [closing, setClosing] = useState(false);
  const timerRef = useRef(null);

  const close = () => {
    setClosing(true);
    setTimeout(onClose, 550);
  };

  useEffect(() => {
    // Auto-cierra a los 6 segundos
    timerRef.current = setTimeout(close, 6000);
    return () => clearTimeout(timerRef.current);
  }, []);

  const anuncios = data.popupAnuncios || [];
  const pedidos  = data.pedidosOracion || [];
  const hasContent = anuncios.length > 0 || pedidos.length > 0;
  if (!hasContent) return null;

  return (
    <div className={`popup-overlay${closing?" out":""}`} onClick={close}>
      <div className={`popup-card${closing?" out":""}`} onClick={e=>e.stopPropagation()}>
        <div className="popup-glow"/>
        <div className="popup-icon">🌸</div>
        <div className="popup-ttl-jp">お知らせ</div>
        <div className="popup-ttl-es">ANUNCIOS IMPORTANTES</div>

        {anuncios.length > 0 && (
          <>
            {anuncios.map((a,i)=>(
              <div key={i} className="popup-item">
                <span className="popup-dot">✦</span>
                <span className="popup-text">{a}</span>
              </div>
            ))}
          </>
        )}

        {pedidos.length > 0 && (
          <>
            <hr className="popup-divider"/>
            <div style={{fontSize:"9px",letterSpacing:"3px",color:"var(--mizu)",marginBottom:"8px",fontFamily:"'Noto Sans JP'"}}>
              🙏 PEDIDOS DE ORACIÓN
            </div>
            {pedidos.map((p,i)=>(
              <div key={i} className="popup-item">
                <span className="popup-dot" style={{color:"var(--mizu)"}}>•</span>
                <span className="popup-text">{p}</span>
              </div>
            ))}
          </>
        )}

        <div className="popup-timer"><div className="popup-timer-bar"/></div>
        <button className="popup-close" onClick={close}>
          閉じる / Cerrar
        </button>
      </div>
    </div>
  );
}

/* ── Editor ── */
function BF({ label, field, data, onChange }) {
  return (
    <div className="ed-bi">
      <div>
        <label className="ed-lbl">{label} 🇯🇵</label>
        <input className="ed-in" style={{marginBottom:0}} value={data[field+"_jp"]??""}
          onChange={e=>onChange(field+"_jp",e.target.value)}/>
      </div>
      <div>
        <label className="ed-lbl">{label} 🇵🇾</label>
        <input className="ed-in" style={{marginBottom:0}} value={data[field+"_es"]??""}
          onChange={e=>onChange(field+"_es",e.target.value)}/>
      </div>
    </div>
  );
}

function Editor({ data, onChange }) {
  const upd = (sec,f,v) => onChange({...data,[sec]:{...data[sec],[f]:v}});
  const updR = (f,v) => onChange({...data,[f]:v});
  return (
    <div className="ed-wrap">
      <div className="ed-group">
        <span className="ed-grp-ttl">📅 ENCABEZADO</span>
        <label className="ed-lbl">Fecha</label>
        <input className="ed-in" value={data.fecha} onChange={e=>updR("fecha",e.target.value)}/>
        <label className="ed-lbl">Saludo</label>
        <input className="ed-in" value={data.feliz} onChange={e=>updR("feliz",e.target.value)}/>
      </div>
      <div className="ed-group">
        <span className="ed-grp-ttl">安息日学校 ESCUELA SABÁTICA</span>
        {[["校長 / Director","director"],["賛美 / Alabanzas","alabanzas"],
          ["賛美歌 / Himno","himno"],["お祈り / Oración","oracion"],
          ["伝道地 / Misionero","misionero"],["ガイド / Lección","leccion"],
          ["賛美歌 2 / Himno 2","himno2"],["お祈り 2 / Oración 2","oracion2"]
        ].map(([l,f])=><BF key={f} label={l} field={f} data={data.escuela} onChange={(ff,v)=>upd("escuela",ff,v)}/>)}
      </div>
      <div className="ed-group">
        <span className="ed-grp-ttl">礼拝 CULTO</span>
        {[["司会 / Presentador","presentador"],["賛美歌 1 / Himno 1","himno1"],
          ["お祈り 1 / Oración 1","oracion1"],["賛美歌 2 / Himno 2","himno2"],
          ["聖書朗読 / Lectura","lecturaBiblica"],["お祈り 2 / Oración 2","oracion2"],
          ["献金 / Ofrenda","ofrenda"],["子どもの話 / Niños","ninos"],
          ["特別讃美歌 / H.Esp.","himnoEspecial"],["説教 / Sermón","sermon"],
          ["賛美歌 3 / Himno 3","himno3"],["お祈り 3 / Oración 3","oracion3"],
          ["奏楽 / Música","musica"],["礼拝後の祈り","oracionFinal"]
        ].map(([l,f])=><BF key={f} label={l} field={f} data={data.culto} onChange={(ff,v)=>upd("culto",ff,v)}/>)}
      </div>
      <div className="ed-group">
        <span className="ed-grp-ttl">発表 ANUNCIOS</span>
        {[["月当番長老 / Anciano","anciano"],["次週説教 / Sermón sig.","sermon_sig"],
          ["掃除 / Limpieza","limpieza"]
        ].map(([l,f])=><BF key={f} label={l} field={f} data={data.anuncios} onChange={(ff,v)=>upd("anuncios",ff,v)}/>)}
        <label className="ed-lbl">Nota especial</label>
        <input className="ed-in" value={data.anuncios.nota} onChange={e=>upd("anuncios","nota",e.target.value)}/>
      </div>
      <div className="ed-group">
        <span className="ed-grp-ttl">📢 ANUNCIOS POPUP / お知らせ</span>
        <div style={{fontSize:"10px",color:"#8A7A60",marginBottom:"8px",fontFamily:"'Noto Sans JP'"}}>
          Aparecen al abrir la página. Uno por línea.
        </div>
        {(data.popupAnuncios||[]).map((a,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 32px",gap:6,marginBottom:6}}>
            <input className="ed-in" style={{marginBottom:0}} value={a}
              onChange={e=>{const arr=[...(data.popupAnuncios||[])];arr[i]=e.target.value;onChange({...data,popupAnuncios:arr});}}/>
            <button style={{background:"var(--aka)",color:"#fff",border:"none",borderRadius:"2px",cursor:"pointer",fontSize:"14px"}}
              onClick={()=>{const arr=[...(data.popupAnuncios||[])];arr.splice(i,1);onChange({...data,popupAnuncios:arr});}}>×</button>
          </div>
        ))}
        <button className="btn-reset" style={{marginTop:4}} onClick={()=>onChange({...data,popupAnuncios:[...(data.popupAnuncios||[]),""]})}>
          + Agregar anuncio
        </button>
      </div>

      <div className="ed-group">
        <span className="ed-grp-ttl">🙏 PEDIDOS DE ORACIÓN / お祈りリスト</span>
        {(data.pedidosOracion||[]).map((p,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 32px",gap:6,marginBottom:6}}>
            <input className="ed-in" style={{marginBottom:0}} value={p}
              onChange={e=>{const arr=[...(data.pedidosOracion||[])];arr[i]=e.target.value;onChange({...data,pedidosOracion:arr});}}/>
            <button style={{background:"var(--aka)",color:"#fff",border:"none",borderRadius:"2px",cursor:"pointer",fontSize:"14px"}}
              onClick={()=>{const arr=[...(data.pedidosOracion||[])];arr.splice(i,1);onChange({...data,pedidosOracion:arr});}}>×</button>
          </div>
        ))}
        <button className="btn-reset" style={{marginTop:4}} onClick={()=>onChange({...data,pedidosOracion:[...(data.pedidosOracion||[]),""]})}>
          + Agregar pedido
        </button>
      </div>

      <div className="ed-group">
        <span className="ed-grp-ttl">執り成しのお祈り ORACIÓN DIARIA</span>
        {data.oraciones.map((o,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"64px 1fr",gap:8,marginBottom:8}}>
            <input className="ed-in" style={{marginBottom:0}} value={o.fecha}
              onChange={e=>{const a=[...data.oraciones];a[i]={...a[i],fecha:e.target.value};onChange({...data,oraciones:a});}}/>
            <input className="ed-in" style={{marginBottom:0}} value={o.texto}
              onChange={e=>{const a=[...data.oraciones];a[i]={...a[i],texto:e.target.value};onChange({...data,oraciones:a});}}/>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [tab, setTab]   = useState("view");
  const [data, setData] = useState(loadData);
  const [toast, setToast] = useState("");
  const [showPopup, setShowPopup] = useState(true);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }, [data]);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""), 2500); };

  const share = () => {
    // Genera link con datos codificados en la URL
    try {
      const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
      const url = window.location.origin + window.location.pathname + "#d=" + encoded;
      const c=data.culto, e=data.escuela, a=data.anuncios;
      const txt=
`🌸 *週報 Boletín Semanal* 🌸
📅 ${data.fecha} — ${data.feliz}

━━ 安息日学校 ESCUELA SABÁTICA ━━
🕗 8:50〜10:25
• 校長: ${e.director_jp} / ${e.director_es}
• ガイド: ${e.leccion_jp} / ${e.leccion_es}

━━ 礼拝 CULTO ━━
🕙 10:30〜11:20
• 司会: ${c.presentador_jp} / ${c.presentador_es}
• 説教: ${c.sermon_jp} / ${c.sermon_es}
• 奏楽: ${c.musica_jp}

━━ 発表 ANUNCIOS ━━
• Anciano: ${a.anciano_jp} / ${a.anciano_es}
• Sermón sig.: ${a.sermon_sig_jp}
${a.nota?"• "+a.nota:""}

🔗 ${url}`;
      if(navigator.share){ navigator.share({title:"週報 "+data.fecha, text:txt}); }
      else{ navigator.clipboard.writeText(txt).then(()=>showToast("✓ Link copiado al portapapeles")); }
    } catch(err) { showToast("Error al generar link"); }
  };

  return (
    <div>
      <div className="hdr">
        <div>
          <div className="hdr-jp">週　報</div>
          <div className="hdr-es">Iglesia Adventista Japonesa · Paraguay</div>
        </div>
        <div className="hdr-date">Paraguay<br/>{data.fecha}</div>
      </div>
      <div className="tabs">
        <button className={`tab ${tab==="view"?"active":""}`} onClick={()=>setTab("view")}>📖 Boletín</button>
        <button className={`tab ${tab==="edit"?"active":""}`} onClick={()=>setTab("edit")}>✏️ Editor</button>
      </div>
      {tab==="view" ? (
        <>
          {showPopup && <Popup data={data} onClose={()=>setShowPopup(false)}/>}
          <Viewer data={data}/>
          <div className="share-bar">
            <button className="share-btn" onClick={share}>🔗 Generar link y compartir</button>
          </div>
        </>
      ) : (
        <>
          <Editor data={data} onChange={setData}/>
          <div style={{padding:"0 12px 4px"}}>
            <button className="btn-ok" onClick={()=>{setTab("view");showToast("✓ Cambios guardados");}}>✓ Guardar y ver</button>
          </div>
          <div style={{padding:"8px 12px 24px"}}>
            <button className="btn-reset" onClick={()=>{
              if(window.confirm("¿Resetear al template para la semana nueva?")){
                setData(initialData); showToast("↺ Template reseteado");
              }
            }}>↺ Nueva semana (resetear)</button>
          </div>
        </>
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
